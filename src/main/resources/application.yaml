spring:
  application:
    name: remittance-service

  datasource:
    url: jdbc:h2:mem:remittance-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

server:
  port: 8080