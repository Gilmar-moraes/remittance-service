spring:
  application:
    name: remittance-service

  datasource:
    url: jdbc:h2:mem:remittance
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: simple

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics